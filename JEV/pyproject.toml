[project]
name = "jev-locator"
version = "0.1.0"
description = "Clasificador de lugares de Colombia (departamento/ciudad) a partir de texto libre, usando JEV y api-colombia.com"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
jev-locator = "jev_locator.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_locator"]
